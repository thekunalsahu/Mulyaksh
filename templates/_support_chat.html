<section class="support-chat" aria-label="Mulyaksh support assistant">
  <button class="chat-launch" type="button" aria-label="Open Mulyaksh support chat" aria-expanded="false" aria-controls="support-chat-panel">
    <span class="robot-halo" aria-hidden="true"></span>
    <svg class="robot-avatar" viewBox="0 0 64 64" aria-hidden="true">
      <path class="robot-antenna" d="M32 8v8"/><circle class="robot-sensor" cx="32" cy="6" r="3"/>
      <rect class="robot-head" x="10" y="17" width="44" height="36" rx="15"/>
      <path class="robot-ear" d="M10 29H6v12h4m44-12h4v12h-4"/>
      <rect class="robot-screen" x="17" y="24" width="30" height="19" rx="8"/>
      <ellipse class="robot-eye" cx="25" cy="33" rx="2.6" ry="3.2"/><ellipse class="robot-eye" cx="39" cy="33" rx="2.6" ry="3.2"/>
      <path class="robot-smile" d="M27 38q5 4 10 0"/><path class="robot-chin" d="M25 49h14"/>
    </svg>
    <i class="robot-status" aria-hidden="true"></i>
    <span class="robot-tooltip">Need a hand?</span>
  </button>
  <div class="chat-panel" id="support-chat-panel" hidden>
    <header class="chat-header">
      <div class="chat-brand-avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="10" y="17" width="44" height="36" rx="15"/><rect x="17" y="24" width="30" height="19" rx="8"/><ellipse cx="25" cy="33" rx="2.6" ry="3.2"/><ellipse cx="39" cy="33" rx="2.6" ry="3.2"/><path d="M27 38q5 4 10 0"/></svg></div>
      <div class="chat-heading"><b>Mulyaksh Assistant</b><small><i></i> Here to help</small></div>
      <button class="chat-close" type="button" aria-label="Close support chat">×</button>
    </header>
    <div class="chat-messages" aria-live="polite">
      <div class="chat-welcome"><span class="welcome-spark">✦</span><b>Namaste! 👋</b><p>Ask anything about Mulyaksh, product pages or QR scans. Photos are optional.</p></div>
      <div class="chat-suggestions"><button type="button">What can Mulyaksh do?</button><button type="button">How does QR verification work?</button></div>
    </div>
    <div class="chat-composer">
      <div class="chat-image-preview" hidden><img alt="Selected product photo preview"><span class="image-name"></span><button type="button" class="remove-image" aria-label="Remove attached photo">×</button></div>
      <form class="chat-form">
        <input class="chat-file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="chat-attach" type="button" aria-label="Attach a product photo" title="Attach a product photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 18a2 2 0 0 1-3-3l7.5-7.5"/></svg></button>
        <label class="sr-only" for="support-chat-input">Your message</label><input id="support-chat-input" maxlength="1000" placeholder="Ask me anything…" autocomplete="off">
        <button class="chat-send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </form>
      <small class="chat-privacy">Photos are optional and only sent when attached. Don’t share private information.</small>
    </div>
  </div>
</section>
